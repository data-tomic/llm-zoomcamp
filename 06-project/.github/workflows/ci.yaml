# Name for the GitHub Actions workflow, which will be displayed on the Actions tab
name: Python Application CI

# Controls when the action will run.
on:
  push:         # Run on every push to any branch
    branches: [ main ]
  pull_request: # Run on pull requests targeting the main branch
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # The name of our single job
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # A job is a sequence of steps
    steps:
      # Step 1: Check out the repository code
      # This action checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up a Python environment
      # This action sets up a Python version and adds it to the PATH
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      # Install project dependencies from requirements.txt. If this fails, the job fails.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Lint and Format Check
      # Check the code for style errors (flake8) and formatting issues (black).
      # This is a critical step for maintaining code quality.
      - name: Lint and Format Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check if the code is formatted according to the Black style guide
          black --check .

      # Step 5: Build Docker Image
      # This step verifies that our Dockerfile is correct and all dependencies
      # inside it can be installed. This is a great integration test.
      - name: Build Docker Image
        run: |
          docker build -t clinical-rag-etl-ci-build .
