# deployment/shared-services-manifests/02-open-webui-deployment.yaml
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui # Dedicated namespace is good practice
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: open-webui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # --- Connection to Ollama ---
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"

            # --- RAG Configuration to use our external ChromaDB ---
            - name: RAG_VECTOR_DB
              value: "chromadb"
            - name: RAG_CHROMADB_URL
              value: "http://chromadb.chromadb.svc.cluster.local:8000"
            # Optional: Specify the embedding model WebUI should use.
            # This MUST match the model used in your ETL pipeline.
            - name: RAG_EMBEDDING_MODEL
              value: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
