name: Python Application CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # === THIS IS THE KEY FIX ===
    # Set the default working directory for all steps in this job
    defaults:
      run:
        working-directory: ./06-project 
    # ==========================

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # This command will now run inside the ./06-project directory
        run: |
          python -m pip install --upgrade pip
          pip install "black[jupyter]"
          pip install -r requirements.txt

      - name: Lint and Format Check
        # This command will also run inside ./06-project
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .

      - name: Build Docker Image
        # And finally, this command will find the Dockerfile
        run: |
          docker build -t clinical-rag-etl-ci-build .
