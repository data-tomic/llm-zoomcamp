name: Python Application CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./06-project 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # === THIS IS THE KEY FIX ===
      # This step now installs BOTH the tools needed for CI AND the project's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Explicitly install the tools needed for the linting/formatting step
          pip install "black[jupyter]" flake8
          # Now, install the production dependencies from the requirements file
          pip install -r requirements.txt
      # ==========================

      - name: Lint and Format Check
        run: |
          # This step will now succeed because flake8 and black are installed
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .

      - name: Build Docker Image
        run: |
          # This step will succeed because requirements.txt is minimal and correct
          docker build -t clinical-rag-etl-ci-build .
